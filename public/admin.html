<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Safe Space | Admin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="/js/aiChatBot.js"></script>
<script>
  tailwind.config={theme:{extend:{colors:{
    "primary":"#3c6d69","primary-dim":"#2f605d","on-primary":"#ffffff",
    "surface":"#fdffda","on-surface":"#383830","surface-container-low":"#fcf9f0",
    "surface-container":"#f6f4ea","outline-variant":"#bbbaaf",
    "on-surface-variant":"#65655c","error":"#af3d3b","secondary":"#376d6d"
  },fontFamily:{"headline":["Manrope"],"body":["Inter"]}}}}
</script>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}</style>
</head>
<body class="font-body text-on-surface bg-surface min-h-screen">

<header class="sticky top-0 z-50 bg-surface flex justify-between items-center px-6 py-4 border-b border-outline-variant/20">
  <div class="flex items-center gap-3">
    <span class="material-symbols-outlined text-primary">admin_panel_settings</span>
    <span class="font-headline font-bold text-primary text-lg">Safe Space Admin</span>
  </div>
  <button onclick="logout()" class="flex items-center gap-2 px-4 py-2 rounded-xl text-error bg-error/5 hover:bg-error/10 border border-error/10 text-sm font-semibold">
    <span class="material-symbols-outlined text-[18px]">logout</span> Logout
  </button>
</header>

<main class="max-w-6xl mx-auto px-6 py-8 space-y-10">

  <!-- Stats -->
  <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>

  <!-- Tabs -->
  <div class="flex gap-2 border-b border-outline-variant/20 pb-0">
    <button onclick="showTab('users')" id="tab-users" class="tab-btn px-5 py-2.5 font-semibold text-sm rounded-t-lg border-b-2 border-primary text-primary">Users</button>
    <button onclick="showTab('sessions')" id="tab-sessions" class="tab-btn px-5 py-2.5 font-semibold text-sm rounded-t-lg border-b-2 border-transparent text-on-surface-variant">Sessions</button>
  </div>

  <!-- Users Table -->
  <div id="panel-users">
    <div class="overflow-x-auto rounded-xl border border-outline-variant/20">
      <table class="w-full text-sm">
        <thead class="bg-surface-container text-on-surface-variant uppercase text-xs tracking-wider">
          <tr>
            <th class="px-4 py-3 text-left">Username</th>
            <th class="px-4 py-3 text-left">Email</th>
            <th class="px-4 py-3 text-left">Role</th>
            <th class="px-4 py-3 text-left">Approved</th>
            <th class="px-4 py-3 text-left">Joined</th>
            <th class="px-4 py-3 text-left">Actions</th>
          </tr>
        </thead>
        <tbody id="usersBody" class="divide-y divide-outline-variant/10 bg-surface-container-low"></tbody>
      </table>
    </div>
  </div>

  <!-- Sessions Table -->
  <div id="panel-sessions" class="hidden">
    <div class="overflow-x-auto rounded-xl border border-outline-variant/20">
      <table class="w-full text-sm">
        <thead class="bg-surface-container text-on-surface-variant uppercase text-xs tracking-wider">
          <tr>
            <th class="px-4 py-3 text-left">User</th>
            <th class="px-4 py-3 text-left">Mentor</th>
            <th class="px-4 py-3 text-left">Status</th>
            <th class="px-4 py-3 text-left">Created</th>
            <th class="px-4 py-3 text-left">Actions</th>
          </tr>
        </thead>
        <tbody id="sessionsBody" class="divide-y divide-outline-variant/10 bg-surface-container-low"></tbody>
      </table>
    </div>
  </div>

</main>

<script>
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || 'null');
if (!token || !user || user.role !== 'admin') location.href = 'login.html';

const api = (url, opts={}) => fetch(url, {...opts, headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`,...(opts.headers||{})}});

async function loadStats() {
  const data = await api('/api/admin/stats').then(r => r.json());
  document.getElementById('stats').innerHTML = [
    ['people', 'Users', data.totalUsers],
    ['volunteer_activism', 'Mentors', data.totalMentors],
    ['forum', 'Total Sessions', data.totalSessions],
    ['chat_bubble', 'Active Now', data.activeSessions]
  ].map(([icon, label, val]) => `
    <div class="bg-surface-container-low rounded-xl p-6 border border-outline-variant/15">
      <span class="material-symbols-outlined text-primary mb-2 block">${icon}</span>
      <div class="text-3xl font-headline font-bold">${val}</div>
      <div class="text-on-surface-variant text-sm mt-1">${label}</div>
    </div>`).join('');
}

async function loadUsers() {
  const data = await api('/api/admin/users').then(r => r.json());
  document.getElementById('usersBody').innerHTML = data.users.map(u => `
    <tr class="hover:bg-surface-container transition-colors">
      <td class="px-4 py-3 font-medium">${u.username}</td>
      <td class="px-4 py-3 text-on-surface-variant">${u.email}</td>
      <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs font-bold uppercase
        ${u.role==='admin'?'bg-primary/10 text-primary':u.role==='mentor'?'bg-secondary/10 text-secondary':'bg-outline-variant/20 text-on-surface-variant'}">
        ${u.role}</span></td>
      <td class="px-4 py-3">
        ${u.role==='mentor'?`<button onclick="toggleApprove('${u._id}',this)"
          class="px-2 py-0.5 rounded-full text-xs font-bold uppercase ${u.isApproved?'bg-green-100 text-green-700':'bg-error/10 text-error'}">
          ${u.isApproved?'Approved':'Suspended'}</button>`:'—'}
      </td>
      <td class="px-4 py-3 text-on-surface-variant">${new Date(u.createdAt).toLocaleDateString()}</td>
      <td class="px-4 py-3">
        ${u.role!=='admin'?`<button onclick="deleteUser('${u._id}',this)"
          class="text-error hover:underline text-xs font-semibold">Delete</button>`:'—'}
      </td>
    </tr>`).join('');
}

async function loadSessions() {
  const data = await api('/api/admin/sessions').then(r => r.json());
  document.getElementById('sessionsBody').innerHTML = data.sessions.map(s => `
    <tr class="hover:bg-surface-container transition-colors">
      <td class="px-4 py-3 font-medium">${s.user?.username||'—'}</td>
      <td class="px-4 py-3">${s.mentor?.username||'Unassigned'}</td>
      <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs font-bold uppercase
        ${s.status==='active'?'bg-green-100 text-green-700':s.status==='pending'?'bg-yellow-100 text-yellow-700':'bg-outline-variant/20 text-on-surface-variant'}">
        ${s.status}</span></td>
      <td class="px-4 py-3 text-on-surface-variant">${new Date(s.createdAt).toLocaleDateString()}</td>
      <td class="px-4 py-3">
        <button onclick="deleteSession('${s._id}',this)" class="text-error hover:underline text-xs font-semibold">Delete</button>
      </td>
    </tr>`).join('');
}

async function toggleApprove(id, btn) {
  const data = await api(`/api/admin/users/${id}/approve`, {method:'PATCH'}).then(r => r.json());
  btn.textContent = data.user.isApproved ? 'Approved' : 'Suspended';
  btn.className = `px-2 py-0.5 rounded-full text-xs font-bold uppercase ${data.user.isApproved?'bg-green-100 text-green-700':'bg-error/10 text-error'}`;
}

async function deleteUser(id, btn) {
  if (!confirm('Delete this user?')) return;
  await api(`/api/admin/users/${id}`, {method:'DELETE'});
  btn.closest('tr').remove();
}

async function deleteSession(id, btn) {
  if (!confirm('Delete this session?')) return;
  await api(`/api/admin/sessions/${id}`, {method:'DELETE'});
  btn.closest('tr').remove();
}

function showTab(tab) {
  ['users','sessions'].forEach(t => {
    document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== tab);
    const btn = document.getElementById(`tab-${t}`);
    btn.className = `tab-btn px-5 py-2.5 font-semibold text-sm rounded-t-lg border-b-2 ${t===tab?'border-primary text-primary':'border-transparent text-on-surface-variant'}`;
  });
}

function logout() { localStorage.clear(); location.href = 'login.html'; }

loadStats(); loadUsers();
document.getElementById('tab-sessions').addEventListener('click', loadSessions);
</script>
</body>
</html>
